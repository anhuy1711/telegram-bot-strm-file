<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STRM Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            background: white;

            padding: 40px;
            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .status {
            margin-top: 20px;

            display: inline-block;

            padding: 8px 16px;

            border-radius: 999px;

            background: #e8f5e9;
            color: #2e7d32;

            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 STRM Bot</h1>

    <div class="status">
        ● Online
    </div>

</div>

</body>
</html>
